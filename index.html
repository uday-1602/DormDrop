<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>DormDrop — College Marketplace for Indian Students</title>
    <meta name="description" content="Buy and sell textbooks, electronics, clothes, furniture and more with students at your college. DormDrop is India's campus-exclusive student marketplace." />
    <meta name="keywords" content="college marketplace india, student marketplace, buy sell hostel, second hand books iit nit, campus marketplace india, dormdrop" />
    <link rel="canonical" href="https://dormdrop.co.in/" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dormdrop.co.in/" />
    <meta property="og:title" content="DormDrop — College Marketplace for Indian Students" />
    <meta property="og:description" content="Buy and sell textbooks, electronics, clothes and more with students at your college. India's campus-exclusive student marketplace." />
    <meta property="og:image" content="https://dormdrop.co.in/og-image.png" />
    <meta property="og:site_name" content="DormDrop" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DormDrop — College Marketplace for Indian Students" />
    <meta name="twitter:description" content="Buy and sell with students at your college. India's campus-exclusive marketplace." />
    <meta name="twitter:image" content="https://dormdrop.co.in/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Structured Data (Schema.org) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "DormDrop",
      "url": "https://dormdrop.co.in",
      "description": "College marketplace for Indian students — buy and sell textbooks, electronics, clothes and more on campus.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://dormdrop.co.in/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
